# ==============================================================================
# QX-Builder 定制配置 (Jhon 版, 基于 suversal/qx-config-sync)
# ==============================================================================
# 使用说明:
# 1. 这是一个 YAML 文件, 请严格保持缩进。
# 2. 所有配置都基于 base 底包进行增量修改。
# 3. 【安全红线】本仓库是公开的: 严禁把任何订阅链接、节点链接、token 写进
#    本文件或仓库的任何文件。订阅只保存在手机 Quantumult X 本地,
#    本配置的 server_remote 永远留空。
# ==============================================================================

# ------------------------------------------------------------------------------
# [核心] 基础设置 (Base)
# ------------------------------------------------------------------------------
base:
  url: "https://ddgksf2013.top/Profile/QuantumultX.conf"

# ------------------------------------------------------------------------------
# [清洗] 补丁排除 (Patches): 删掉底包自带策略组, 下面注入自己的
# ------------------------------------------------------------------------------
patches:
  policy:
    keywords:
      - "Hijacking"
      - "广告"
      - "static"
      - "url-latency-benchmark"
  dns:
    keywords: ["no-ipv6"]
  filter_local:
    keywords: ["github"]

# ------------------------------------------------------------------------------
# [通用] 全局设置 (General)
# ------------------------------------------------------------------------------
general:

# ------------------------------------------------------------------------------
# [映射] 策略组映射 (Policy Map): 第三方规则的策略名 -> 本配置的策略组名
# ------------------------------------------------------------------------------
policy_map:
  us-node: "美国节点"
  hk-node: "香港节点"
  direct: "direct"
  reject: "reject"

# ------------------------------------------------------------------------------
# [策略] 自定义策略组 (Policy)
# 兼容底包分流规则的目标组名 (苹果服务/全球加速/哔哩哔哩/声田音乐/国际媒体/
# 兜底分流 + 地区测速组) 必须保留, 否则底包规则会指向不存在的策略组。
# 自有节点识别: TW-GCP 自动进台湾组, Home-JP 自动进日本组,
# 俄勒冈-free-vm 已加入美国组正则 (认 "俄勒冈" 和 "free-vm")。
# ------------------------------------------------------------------------------
policy:
  # ---- Jhon 自己的策略组 ----
  # 交易所: 只允许台湾出口 (第一个 = 自有台湾节点 TW-GCP, 默认选中)
  - "static=交易所, TW-GCP, 台湾节点, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/Final.png"
  # Ai: 家宽日本 Home-JP 默认 (第一个), 俄勒冈次选
  - "static=Ai, Home-JP, 俄勒冈-free-vm, 日本节点, 美国节点, 台湾节点, 手动选择, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/Global.png"
  # Telegram
  - "static=Telegram, TW-GCP, 台湾节点, 俄勒冈-free-vm, 美国节点, 日本节点, 手动选择, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram.png"
  # ---- 底包兼容策略组 ----
  - "static=苹果服务, direct, 香港节点, 台湾节点, 美国节点, 日本节点, 狮城节点, proxy, 手动选择, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Apple.png"
  - "static=全球加速, 自动选择, direct, 香港节点, 台湾节点, 日本节点, 狮城节点, 美国节点, proxy, 手动选择, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/Global.png"
  - "static=哔哩哔哩, direct, 香港节点, 台湾节点, 手动选择, 视频节点, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/bilibili.png"
  - "static=声田音乐, 美国节点, 自动选择, direct, 台湾节点, 香港节点, 日本节点, 狮城节点, proxy, 手动选择, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/Spotify.png"
  - "static=国际媒体, 台湾节点, 自动选择, direct, 香港节点, 日本节点, 美国节点, 狮城节点, proxy, 手动选择, 视频节点, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/Streaming.png"
  - "static=兜底分流, 自动选择, 全球加速, direct, 香港节点, 台湾节点, 日本节点, 狮城节点, 美国节点, proxy, 手动选择, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/Final.png"
  - "static=手动选择, server-tag-regex=.*, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available.png"
  - "static=美国节点, server-tag-regex=(?=.*(美|US|俄勒冈|free-vm|(?i)States|American))^((?!(港|台|日|韩|新)).)*$, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/US.png"
  - "static=视频节点, server-tag-regex=.*, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/LineTV.png"
  # ---- 地区自动测速组 (15 分钟测速一次) ----
  - "url-latency-benchmark=香港节点, server-tag-regex=(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|美)).)*$, check-interval=900, tolerance=20, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/HK.png"
  - "url-latency-benchmark=台湾节点, server-tag-regex=(?=.*(台|TW|(?i)Taiwan))^((?!(港|日|韩|新|美)).)*$, check-interval=900, tolerance=20, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/TW.png"
  - "url-latency-benchmark=日本节点, server-tag-regex=(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$, check-interval=900, tolerance=20, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/JP.png"
  - "url-latency-benchmark=狮城节点, server-tag-regex=(?=.*(新|狮|獅|SG|(?i)Singapore))^((?!(港|台|日|韩|美)).)*$, check-interval=900, tolerance=20, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/SG.png"
  - "url-latency-benchmark=自动选择, server-tag-regex=.*, check-interval=900, tolerance=20, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png"

# ------------------------------------------------------------------------------
# [节点] 订阅 (Server Remote)
# 【永远留空】公开仓库写订阅链接 = 泄露。订阅只存在手机 QX 本地。
# ------------------------------------------------------------------------------
server_remote:

# ------------------------------------------------------------------------------
# [规则] 本地分流 (Local Filters) - Jhon 自己的规则, top = 最高优先级
# ------------------------------------------------------------------------------
local_filters:
  top:
    # 交易所域名 -> 交易所策略组 (只走台湾)
    - "host-suffix, binance.com, 交易所"
    - "host-suffix, okx.com, 交易所"
    - "host-suffix, bybit.com, 交易所"
    - "host-suffix, bitget.com, 交易所"
    - "host-suffix, gate.io, 交易所"
    # Grok 付费链路 -> 俄勒冈节点直达 (避开慢速家宽, 否则支付/验证超时)
    - "host-suffix, x.ai, 俄勒冈-free-vm"
    - "host-suffix, stripe.com, 俄勒冈-free-vm"
    - "host-suffix, challenges.cloudflare.com, 俄勒冈-free-vm"
    # Steam: 登录/下载直连, 商店走手动选择
    - "host-suffix, login.steampowered.com, direct"
    - "host-suffix, api.steampowered.com, direct"
    - "host-suffix, help.steampowered.com, direct"
    - "host-suffix, steamcontent.com, direct"
    - "host-suffix, steampipe.akamaized.net, direct"
    - "host-suffix, store.steampowered.com, 手动选择"
    - "host-suffix, checkout.steampowered.com, 手动选择"
    - "host-suffix, steamcommunity.com, 手动选择"
    - "host-suffix, steamstatic.com, 手动选择"
    # 网易云音乐广告域名拦截 (ios151/NeteasemusicAd 的 filter 部分)
    - "host, iadmusicmat.music.126.net, reject"
    - "host, iadmat.nosdn.127.net, reject"
    - "host, iadmatapk.nosdn.127.net, reject"
    - "host, httpdns.n.netease.com, reject"
    - "host, httpdns.music.163.com, reject"
  bottom:
    # - "geoip, cn, direct"

# ------------------------------------------------------------------------------
# [规则] 远程分流 (Filter Remote) - 只放去广告/防劫持类 (blackmatrix7)
# 注: suversal 原配置的 TikTok/Gemini/Binance 分流已按需求移除
# (尤其 Binance 他走香港节点, 与本配置"交易所只走台湾"冲突)。
# ------------------------------------------------------------------------------
filter_remote:
  - name: "Advertising"
    source: "blackmatrix7"
    policy: "reject"
    tag: "广告拦截"
  - name: "ZhihuAds"
    source: "blackmatrix7"
    policy: "reject"
    tag: "知乎广告"
  - name: "Hijacking"
    source: "blackmatrix7"
    policy: "reject"
    tag: "防劫持"
  - name: "EasyPrivacy"
    source: "blackmatrix7"
    policy: "reject"
    tag: "隐私追踪拦截"
  - name: "BlockHttpDNS"
    source: "blackmatrix7"
    policy: "reject"
    tag: "拦截HTTPDNS"

# ------------------------------------------------------------------------------
# [修改] 本地重写 (Rewrite Local)
# ------------------------------------------------------------------------------
rewrite_local:
  - "file://rules/my_rewrites.list"

# ------------------------------------------------------------------------------
# [引用] 远程重写 (Rewrite Remote) - 只保留去广告
# 底包已自带: B站/开屏/彩云天气/知乎/YouTube/微博/高德/网易云/闲鱼/小红书
# 等去广告, 这里只补底包没有的, 避免同 App 双规则冲突。
# suversal 的 Sub-Store / PluginHub 是工具不是去广告, 已移除。
# ------------------------------------------------------------------------------
rewrite_remote:
  - "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rewrite/QuantumultX/Advertising/Advertising.conf, tag=综合去广告@blackmatrix7, enabled=true"
  - "https://limbopro.com/Adblock4limbo.conf, tag=毒奶特供(去网页广告计划), enabled=true"
  - "https://kelee.one/Tool/Loon/Lpx/Tieba_remove_ads.lpx, tag=贴吧去广告, enabled=true, opt-parser=true"
  - "https://kelee.one/Tool/Loon/Lpx/Cainiao_remove_ads.lpx, tag=菜鸟去广告, enabled=true, opt-parser=true"
  - "https://kelee.one/Tool/Loon/Lpx/MojiWeather_remove_ads.lpx, tag=墨迹天气去广告, enabled=true, opt-parser=true"
  - "https://kelee.one/Tool/Loon/Lpx/Weixin_Official_Accounts_remove_ads.lpx, tag=微信公众号去广告, enabled=true, opt-parser=true"

# ------------------------------------------------------------------------------
# [其他] 定时任务 (Task Local) - 暂无
# ------------------------------------------------------------------------------
task_local:

# ------------------------------------------------------------------------------
# [高级] MITM: 追加网易云音乐去广告所需域名 (与底包智能合并, 不覆盖)
# ------------------------------------------------------------------------------
mitm:
  hostname: "file://rules/jhon_mitm_hosts.list"
